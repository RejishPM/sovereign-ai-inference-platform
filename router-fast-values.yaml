router:
  modelServers:
    matchLabels:
      app: sim-fast

  proxy:
    enabled: true
    proxyType: envoy
    mode: sidecar
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

  epp:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
