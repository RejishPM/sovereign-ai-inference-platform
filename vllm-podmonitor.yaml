apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm-cpu
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - inference
  selector:
    matchLabels:
      app: vllm-fast-qwen
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
