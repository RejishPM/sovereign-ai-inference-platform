# CPU-only llm-d inference simulators: NO real model weights are loaded.
# Compatible simulator release: v1.2.0 (verify deployment image digest before public release).
# Intended to be used with an independently deployed llm-d router.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-fast
  namespace: inference
  labels:
    app: sim-fast
    inference-demo: simulated
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sim-fast
  template:
    metadata:
      labels:
        app: sim-fast
        pool: fast
        inference-demo: simulated
    spec:
      containers:
        - name: inference-sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.2.0
          imagePullPolicy: IfNotPresent
          args:
            - --port=8000
            - --model=SmolLM2-360M
            - --time-to-first-token=15ms
            - --inter-token-latency=5ms
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sim-fast
  namespace: inference
  labels:
    app: sim-fast
spec:
  type: ClusterIP
  selector:
    app: sim-fast
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-reasoning
  namespace: inference
  labels:
    app: sim-reasoning
    inference-demo: simulated
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sim-reasoning
  template:
    metadata:
      labels:
        app: sim-reasoning
        pool: reasoning
        inference-demo: simulated
    spec:
      containers:
        - name: inference-sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.2.0
          imagePullPolicy: IfNotPresent
          args:
            - --port=8000
            - --model=Qwen2.5-0.5B
            - --time-to-first-token=60ms
            - --inter-token-latency=15ms
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sim-reasoning
  namespace: inference
  labels:
    app: sim-reasoning
spec:
  type: ClusterIP
  selector:
    app: sim-reasoning
  ports:
    - name: http
      port: 8000
      targetPort: http
