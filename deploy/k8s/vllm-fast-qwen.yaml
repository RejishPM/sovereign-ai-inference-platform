apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-fast-qwen
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-fast-qwen
  template:
    metadata:
      labels:
        app: vllm-fast-qwen
        llm-d.ai/engine-type: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:v0.33.0-x86_64
          imagePullPolicy: IfNotPresent
          args:
            - "--model=Qwen/Qwen2.5-0.5B-Instruct"
            - "--port=8000"
            - "--dtype=auto"
            - "--max-model-len=1024"
            - "--enforce-eager"
            - "--kv-cache-memory-bytes=1073741824"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "3"
              memory: 7Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-fast-qwen
  namespace: inference
spec:
  type: ClusterIP
  selector:
    app: vllm-fast-qwen
  ports:
    - name: http
      port: 8000
      targetPort: 8000
